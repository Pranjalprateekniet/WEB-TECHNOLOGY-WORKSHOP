<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Form Elements</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .header { background: linear-gradient(45deg, #fd79a8, #fdcb6e); color: white; padding: 20px; border-radius: 10px; text-align: center; margin-bottom: 25px; }
        .form-section { background: #f8f9fa; padding: 20px; border-radius: 10px; margin: 20px 0; border-left: 5px solid #e17055; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #2d3436; }
        input, select, textarea { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { border-color: #667eea; outline: none; box-shadow: 0 0 5px rgba(102, 126, 234, 0.3); }
        
        .radio-group, .checkbox-group { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 10px; }
        .radio-item, .checkbox-item { display: flex; align-items: center; background: white; padding: 8px 12px; border-radius: 6px; border: 2px solid #ddd; cursor: pointer; }
        .radio-item:hover, .checkbox-item:hover { border-color: #667eea; background: #f0f3ff; }
        .radio-item input, .checkbox-item input { width: auto; margin-right: 8px; }
        
        .submit-btn { background: linear-gradient(45deg, #00b894, #00a085); color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .required { color: #e74c3c; }
        .output { background: #2d3436; color: #00b894; padding: 15px; border-radius: 8px; margin-top: 20px; display: none; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Advanced Registration Form</h1>
            <p>Student: Pranjal Prateek | Branch: IT-C | College: NIET</p>
        </div>

        <form id="advancedForm" onsubmit="handleSubmit(event)">
            <div class="form-section">
                <h3>Personal Information</h3>
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName" required placeholder="Enter first name">
                </div>
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="+91-9876543210">
                </div>
            </div>

            <div class="form-section">
                <h3>Gender & Preferences</h3>
                <div class="form-group">
                    <label>Gender <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="male" name="gender" value="male" required>
                            <label for="male">Male</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="female" name="gender" value="female" required>
                            <label for="female">Female</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="other" name="gender" value="other" required>
                            <label for="other">Other</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Interests (Select all that apply)</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="programming" name="interests" value="programming">
                            <label for="programming">Programming</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="music" name="interests" value="music">
                            <label for="music">Music</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="sports" name="interests" value="sports">
                            <label for="sports">Sports</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="reading" name="interests" value="reading">
                            <label for="reading">Reading</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Account Security</h3>
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" name="username" required placeholder="Choose username" minlength="3">
                </div>
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required placeholder="Create password" minlength="6">
                </div>
            </div>

            <div class="form-section">
                <h3>Additional Information</h3>
                <div class="form-group">
                    <label for="education">Education Level</label>
                    <select id="education" name="education">
                        <option value="">-- Select Education --</option>
                        <option value="high-school">High School</option>
                        <option value="undergraduate">Undergraduate</option>
                        <option value="postgraduate">Postgraduate</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bio">About Yourself</label>
                    <textarea id="bio" name="bio" rows="3" placeholder="Tell us about yourself..."></textarea>
                </div>
                <div class="form-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to Terms and Conditions <span class="required">*</span></label>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn">Create Account</button>
        </form>

        <div class="output" id="outputArea">
            <div id="outputContent"></div>
        </div>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const data = {};
            
            for (let [key, value] of formData.entries()) {
                if (data[key]) {
                    if (Array.isArray(data[key])) {
                        data[key].push(value);
                    } else {
                        data[key] = [data[key], value];
                    }
                } else {
                    data[key] = value;
                }
            }
            
            // Validation
            if (!data.firstName || !data.email || !data.phone || !data.gender || !data.username || !data.password || !data.terms) {
                alert('Please fill all required fields!');
                return;
            }
            
            if (!data.interests) {
                alert('Please select at least one interest!');
                return;
            }
            
            // Display results
            let output = `<strong>✅ Registration successful!</strong><br><br>
                <strong>Name:</strong> ${data.firstName}<br>
                <strong>Email:</strong> ${data.email}<br>
                <strong>Phone:</strong> ${data.phone}<br>
                <strong>Gender:</strong> ${data.gender}<br>
                <strong>Username:</strong> ${data.username}<br>`;
            
            if (data.interests) {
                const interests = Array.isArray(data.interests) ? data.interests : [data.interests];
                output += `<strong>Interests:</strong> ${interests.join(', ')}<br>`;
            }
            
            if (data.education) output += `<strong>Education:</strong> ${data.education}<br>`;
            if (data.bio) output += `<strong>Bio:</strong> ${data.bio}<br>`;
            
            output += `<br><strong>Registration Time:</strong> ${new Date().toLocaleString()}`;
            
            document.getElementById('outputContent').innerHTML = output;
            document.getElementById('outputArea').style.display = 'block';
            document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
